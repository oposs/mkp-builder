name: Release publisher

# Second half of the release. "Create release PR" prepares a PR; merging it lands the
# rolled CHANGES.md and the synced plugin.json on main, and that merge triggers this.
#
# main is protected by a ruleset and GITHUB_TOKEN cannot be granted a bypass (the bypass
# list takes users, teams and GitHub Apps -- not the built-in Actions token). So nothing
# here pushes to a branch. Tagging is unaffected: the ruleset targets branches, and tags
# are a separate ref namespace.
#
# The version is read from .claude-plugin/plugin.json rather than passed between jobs,
# which makes this idempotent: if that version is already tagged there is nothing to do.
# A re-run or an unrelated push to main is therefore harmless.
#
# There is deliberately no workflow_dispatch. Publishing should be a consequence of
# merging a release PR, never something anyone starts by hand. Combined with the branch
# ruleset, which forbids pushing to main directly, that leaves exactly one way to reach
# this workflow: merge a PR that changes plugin.json. Recovery does not need a manual
# trigger either -- a failed run can be re-run from the Actions UI, and because the
# version comes from the repository rather than from run inputs, the re-run does exactly
# what the original attempt would have done.

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/plugin.json'

concurrency:
  group: release-publisher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          echo "::group::Determining version"

          VERSION_NO_V=$(jq -r '.version' .claude-plugin/plugin.json)
          if [[ -z "$VERSION_NO_V" || "$VERSION_NO_V" == "null" ]]; then
            echo "::error title=No version::.claude-plugin/plugin.json has no version"
            exit 1
          fi
          VERSION="v${VERSION_NO_V}"

          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::notice title=Already released::${VERSION} is already tagged - nothing to do"
            echo "already_released=true" >> $GITHUB_OUTPUT
            echo "Nothing to publish: \`${VERSION}\` is already tagged." >> $GITHUB_STEP_SUMMARY
          else
            echo "already_released=false" >> $GITHUB_OUTPUT
            echo "::notice title=Publishing::${VERSION}"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_no_v=${VERSION_NO_V}" >> $GITHUB_OUTPUT
          echo "major=v${VERSION_NO_V%%.*}" >> $GITHUB_OUTPUT
          echo "::endgroup::"

      - name: Extract release notes
        if: steps.version.outputs.already_released == 'false'
        env:
          VERSION_NO_V: ${{ steps.version.outputs.version_no_v }}
        run: |
          set -euo pipefail
          echo "::group::Extracting release notes"
          perl -e '
            my $version = $ARGV[0];
            undef $/;
            my $content = <STDIN>;
            if ($content =~ /## \Q$version\E[^\n]*\n(.*?)(?=\n## [0-9]|$)/s) {
              my $section = $1;
              $section =~ s/^\s+|\s+$//g;
              print $section;
            } else {
              print "Release version $version\n";
              warn "WARNING: Could not find version $version in CHANGES.md\n";
            }
          ' "$VERSION_NO_V" < CHANGES.md > release_notes_final.md
          cat release_notes_final.md
          echo "::endgroup::"

      - name: Create and push tags
        if: steps.version.outputs.already_released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR_VERSION: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail
          echo "::group::Creating tags"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          echo "::notice title=Tag Created::${VERSION}"

          # Moving tag so consumers can pin oposs/mkp-builder@v2
          git tag -f -a "${MAJOR_VERSION}" -m "Update ${MAJOR_VERSION} to ${VERSION}"
          git push origin "${MAJOR_VERSION}" --force
          echo "::notice title=Major Tag Updated::${MAJOR_VERSION} -> ${VERSION}"
          echo "::endgroup::"

      - name: Create GitHub release
        id: create_release
        if: steps.version.outputs.already_released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version_no_v }}
          draft: false
          prerelease: false
          body_path: release_notes_final.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        if: steps.version.outputs.already_released == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR_VERSION: ${{ steps.version.outputs.major }}
        run: |
          {
            echo "## Release Summary"
            echo "- **Version:** ${VERSION}"
            echo "- **Release URL:** ${{ steps.create_release.outputs.url }}"
            echo ""
            echo "**Usage:**"
            echo '```yaml'
            echo "- uses: oposs/mkp-builder@${VERSION}      # exact"
            echo "- uses: oposs/mkp-builder@${MAJOR_VERSION}            # latest ${MAJOR_VERSION}.x"
            echo '```'
            echo ""
            echo "### Release Notes"
            cat release_notes_final.md
          } >> $GITHUB_STEP_SUMMARY
